image: python:3.12-slim

definitions:
  steps:
    - step: &test
        name: Lint & Test
        caches:
          - pip
        script:
          - pip install poetry==1.8.0
          - poetry install --no-interaction
          - poetry run ruff check nexus_mcp tests
          - python3 -c "import urllib.request,os; req=urllib.request.Request('https://api.bitbucket.org/2.0/repositories/wazobiatech/nexus-mcp-contract/src/HEAD/vectors.json',headers={'Authorization':'Bearer '+os.environ['BITBUCKET_TOKEN']}); open('vectors.json','wb').write(urllib.request.urlopen(req).read())"
          - poetry run pytest -v

pipelines:
  default:
    - step: *test

  branches:
    main:
      - step: *test

  tags:
    v*:
      - step: *test
      - step:
          name: Publish to private PyPI
          deployment: production
          caches:
            - pip
          script:
            - pip install poetry==1.8.0
            - poetry install --no-interaction
            - poetry config repositories.wazobia $WAZOBIA_PYPI_URL
            - poetry config pypi-token.wazobia $WAZOBIA_PYPI_TOKEN
            - poetry build
            - poetry publish --repository wazobia
