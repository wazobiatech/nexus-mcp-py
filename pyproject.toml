[tool.poetry]
name = "wazobiatech-nexus-mcp"
version = "1.1.1"
description = "Python SDK for Nexus MCP"
authors = ["Wazobia Tech <dev@wazobiatech.com>"]
readme = "README.md"
packages = [{include = "nexus_mcp"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
starlette = "^0.36.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
