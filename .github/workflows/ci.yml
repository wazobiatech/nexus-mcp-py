name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  tags:
    - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.0

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with ruff
        run: poetry run ruff check nexus_mcp tests

      - name: Download contract vectors
        run: |
          curl -L -o vectors.json \
            https://raw.githubusercontent.com/wazobiatech/nexus-mcp-contract/v1.0.0/vectors.json

      - name: Run contract vector tests
        run: poetry run pytest tests/test_hmac_utils.py -v

      - name: Run unit tests
        run: poetry run pytest -v

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: snok/install-poetry@v1
        with:
          version: 1.8.0
      - run: poetry install --no-interaction
      - run: poetry build
      - run: poetry publish --repository private-pypi
        env:
          POETRY_PYPI_TOKEN_PRIVATE_PYPI: ${{ secrets.PRIVATE_PYPI_TOKEN }}
